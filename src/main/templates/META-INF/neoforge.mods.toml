modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/pikachesrar-ui/minecraft-chaos-events/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/pikachesrar-ui/minecraft-chaos-events"
authors="pikachesrar-ui"
description='''
Operator-controlled chaos for Minecraft multiplayer: randomized world events,
nonlethal micro pranks, timed trivia and spatial player swaps.
'''

[[mixins]]
config="chaosevents.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
