name: Release

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
    paths:
      - "gradle.properties"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Resolve release tag
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            version="$(grep '^mod_version=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')"
            if [[ -z "$version" ]]; then
              echo "Unable to read mod_version from gradle.properties" >&2
              exit 1
            fi
            tag="v$version"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./gradlew build

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" build/libs/*.jar --clobber
          else
            gh release create "$RELEASE_TAG" build/libs/*.jar \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --title "Chaos Events $RELEASE_TAG"
          fi
